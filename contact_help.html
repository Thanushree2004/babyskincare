<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact Us & Help - Smart Baby Skin Scanner</title>
<link rel="icon" href="https://cdn-icons-png.flaticon.com/512/4762/4762967.png" type="image/png">

<style>
  body {
    background: url('background.png') no-repeat center center fixed;
    background-size: cover;
    font-family: Arial, sans-serif;
    margin: 0;
    text-align: center;
    min-height: 100vh;
  }

  /* FIXED NAVBAR (NO HAMBURGER) */
  nav {
    background-color: #4CAF50;
    padding: 12px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    white-space: nowrap;
    width: 100%;
    box-sizing: border-box;
  }

  .logo {
    color: white;
    font-size: 24px;
    font-weight: bold;
  }

  .nav-links {
    list-style: none;
    display: flex;
    gap: 25px;
    margin: 0;
    padding: 0;
  }

  .nav-links li {
    display: inline-block;
  }

  .nav-links li a {
    color: white;
    text-decoration: none;
    font-size: 18px;
    font-weight: bold;
  }

  .nav-links li a:hover {
    text-decoration: underline;
  }

  #languageSwitcher {
    margin-left: 15px;
    padding: 5px;
  }

  /* CONTACT FORM */
  section {
    margin-top: 40px;
    width: 90%;
    max-width: 500px;
    margin-left: auto;
    margin-right: auto;
  }

  form {
    background: rgba(255, 255, 255, 0.92);
    padding: 20px;
    border-radius: 10px;
    text-align: left;
    box-shadow: 0 4px 10px rgba(0,0,0,0.3);
  }

  input, textarea {
    width: 100%;
    padding: 10px;
    margin: 10px 0;
    border: 1px solid #ddd;
    border-radius: 5px;
    font-size: 16px;
    box-sizing: border-box;
  }

  button {
    width: 100%;
    padding: 12px;
    background-color: #4CAF50;
    color: white;
    border: none;
    border-radius: 5px;
    font-size: 16px;
    cursor: pointer;
  }

  button:hover {
    background-color: #419e45;
  }

  /* Chat widget removed */
</style>
</head>

<body>

<!-- FIXED NAVBAR -->
<nav>
  <div class="logo">👶 Baby Skin Care</div>

  <ul class="nav-links">
    <li><a href="home.html">Home</a></li>
    <li><a href="upload.html">Upload</a></li>
    <li><a href="about.html">About</a></li>
    <li><a href="contact_help.html">Contact & Help</a></li>
    <li><a href="#" onclick="openDashboard()">Dashboard →</a></li>
  </ul>

  <select id="languageSwitcher">
    <option value="en">English</option>
    <option value="kn">ಕನ್ನಡ</option>
  </select>
</nav>

<!-- CONTACT SECTION -->
<section>
  <h1 data-en="Contact Us & Help" data-kn="ಸಂಪರ್ಕಿಸಿ ಮತ್ತು ಸಹಾಯ">Contact Us & Help</h1>

  <p data-en="If you have any questions or need assistance, feel free to reach out to us."
     data-kn="ನಿಮಗೆ ಯಾವುದೇ ಪ್ರಶ್ನೆಗಳಿದ್ದರೆ ಅಥವಾ ಸಹಾಯ ಬೇಕಿದ್ದರೆ, ನಮ್ಮನ್ನು ಸಂಪರ್ಕಿಸಿ.">
     If you have any questions or need assistance, feel free to reach out to us.
  </p>

  <form id="contactForm">
    <input type="text" id="name" data-en-placeholder="Your Name" data-kn-placeholder="ನಿಮ್ಮ ಹೆಸರು" placeholder="Your Name" required>
    <input type="email" id="email" data-en-placeholder="Your Email" data-kn-placeholder="ನಿಮ್ಮ ಇಮೇಲ್" placeholder="Your Email" required>
    <textarea id="message" data-en-placeholder="Your Message" data-kn-placeholder="ನಿಮ್ಮ ಸಂದೇಶ" placeholder="Your Message"></textarea>
    <button type="submit" id="sendBtn" data-en="Send Message" data-kn="ಸಂದೇಶ ಕಳುಹಿಸಿ">Send Message</button>
  </form>
</section>

<!-- Chat widget removed -->

<script>
  /* Dashboard */
  function openDashboard() {
    const role = localStorage.getItem("role");
    if (role === "parent") window.location.href = "parent_dashboard.html";
    else if (role === "doctor") window.location.href = "doctor_dashboard.html";
  }

  /* Contact form */
  const form=document.getElementById('contactForm');
  const sendBtn=document.getElementById('sendBtn');
  form.addEventListener('submit', function(e){
    e.preventDefault();

    const name=document.getElementById('name').value;
    const email=document.getElementById('email').value;
    const message=document.getElementById('message').value;

    sendBtn.disabled=true;
    sendBtn.textContent="Opening Gmail…";

    const subject=encodeURIComponent("Contact Form Submission");
    const body=encodeURIComponent(`Name: ${name}\nEmail: ${email}\nMessage:\n${message}`);

    window.open(`https://mail.google.com/mail/?view=cm&fs=1&to=neocare.help@gmail.com&su=${subject}&body=${body}`, "_blank");

    setTimeout(()=>{
      sendBtn.disabled=false;
      sendBtn.textContent=sendBtn.getAttribute("data-en");
      form.reset();
    },2000);
  });

  /* Chat widget removed */

  /* Language Switcher */
  const switcher=document.getElementById("languageSwitcher");
  function setLanguage(lang){
    document.querySelectorAll("[data-en]").forEach(el=>{
      el.textContent=el.getAttribute("data-"+lang);
    });
    document.querySelectorAll("[data-en-placeholder]").forEach(el=>{
      el.placeholder=el.getAttribute("data-"+lang+"-placeholder");
    });
    sendBtn.textContent=sendBtn.getAttribute("data-"+lang);
    localStorage.setItem("lang",lang);
  }

  const savedLang=localStorage.getItem("lang")||"en";
  switcher.value=savedLang;
  setLanguage(savedLang);
  switcher.addEventListener("change",()=>setLanguage(switcher.value));
</script>
<script src="lang.js"></script>

</body>
</html>

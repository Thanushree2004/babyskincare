<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-en="Home - Smart Baby Skin Scanner" data-kn="ಮುಖಪುಟ - ಸ್ಮಾರ್ಟ್ ಬೇಬಿ ಸ್ಕಿನ್ ಸ್ಕ್ಯಾನರ್">
    Home - Smart Baby Skin Scanner
  </title>
  <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/4762/4762967.png">

  <style>
    body {
      background: url('background.png') no-repeat center center fixed;
      background-size: cover;
      font-family: Arial, sans-serif;
      margin: 0;
      text-align: center;
      min-height: 100vh;
    }

    nav {
      background-color: rgba(76, 175, 80, 0.95);
      padding: 12px 30px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      color: white;
      font-size: 26px;
      font-weight: bold;
    }

    .nav-links {
      list-style: none;
      display: flex;
      gap: 25px;
      margin: 0;
      padding: 0;
    }

    .nav-links li a {
      color: white;
      text-decoration: none;
      font-size: 18px;
      font-weight: bold;
    }

    .nav-links li a:hover {
      text-decoration: underline;
    }

    .logout-btn {
      background: white;
      color: #4CAF50;
      font-weight: bold;
      padding: 6px 14px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      font-size: 16px;
    }

    .hero {
      margin-top: 100px;
      padding: 40px 20px;
      background: rgba(255, 255, 255, 0.85);
      width: 90%;
      max-width: 600px;
      border-radius: 15px;
      margin-left: auto;
      margin-right: auto;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    }

    .hero h1 {
      color: #4CAF50;
      font-size: 36px;
      margin-bottom: 10px;
    }

    .hero p {
      color: #444;
      font-size: 18px;
      line-height: 1.6;
    }

  </style>
</head>

<body>

  <!-- NAVBAR -->
  <nav>
    <div class="logo" 
         data-en="👶 Baby Skin Care" 
         data-kn="👶 ಬೇಬಿ ಸ್ಕಿನ್ ಕೇರ್">
         👶 Baby Skin Care
    </div>

    <ul class="nav-links">
      <li><a href="home.html" data-en="Home" data-kn="ಮುಖಪುಟ">Home</a></li>
      <li><a href="upload.html" data-en="Upload" data-kn="ಅಪ್ಲೋಡ್">Upload</a></li>
      <li><a href="about.html" data-en="About" data-kn="ಬಗ್ಗೆ">About</a></li>
      <li><a href="contact_help.html" data-en="Contact & Help" data-kn="ಸಂಪರ್ಕ & ಸಹಾಯ">Contact & Help</a></li>
      <li><a href="#" onclick="openDashboard()" data-en="Dashboard →" data-kn="ಡ್ಯಾಶ್‌ಬೋರ್ಡ್ →">Dashboard →</a></li>
    </ul>

    <button class="logout-btn" onclick="logout()"
            data-en="Logout" data-kn="ಲಾಗ್ ಔಟ್">
            Logout
    </button>

    <select id="languageSwitcher" style="margin-left: 15px;">
      <option value="en">English</option>
      <option value="kn">ಕನ್ನಡ</option>
    </select>
  </nav>

  <!-- HERO -->
  <div class="hero">
    <h1 data-en="Welcome to Smart Baby Skin Scanner"
        data-kn="ಸ್ಮಾರ್ಟ್ ಬೇಬಿ ಸ್ಕಿನ್ ಸ್ಕ್ಯಾನರ್‌ಗೆ ಸ್ವಾಗತ">
        Welcome to Smart Baby Skin Scanner
    </h1>

    <p data-en="An AI-powered solution for early detection of baby skin conditions. Analyze, predict, and consult — all in one place."
       data-kn="ಮಗುವಿನ ಚರ್ಮದ ಸಮಸ್ಯೆಗಳನ್ನು ಬೇಗ ಪತ್ತೆಹಚ್ಚಲು AI ಆಧಾರಿತ ಪರಿಹಾರ. ವಿಶ್ಲೇಷಿಸಿ, ಪೂರ್ವಾನುಮಾನ ಮಾಡಿ, ಮತ್ತು ಸಮಾಲೋಚನೆ—ಎಲ್ಲವೂ ಒಂದೇ ಸ್ಥಳದಲ್ಲಿ.">
       An AI-powered solution for early detection of baby skin conditions.
    </p>
  </div>

  <!-- JS -->
  <script>
    function openDashboard() {
      const role = localStorage.getItem("role");
      if (role === "parent") {
        window.location.href = "parent_dashboard.html";
      } else if (role === "doctor") {
        window.location.href = "doctor_dashboard.html";
      } else {
        alert("Please login first!");
      }
    }

    function logout() {
      localStorage.removeItem("token");
      localStorage.removeItem("role");
      window.location.href = "login.html";
    }

    if (!localStorage.getItem("token")) {
      window.location.href = "login.html";
    }

    const switcher = document.getElementById("languageSwitcher");
    const savedLang = localStorage.getItem("lang") || "en";
    switcher.value = savedLang;

    switcher.addEventListener("change", () => {
      localStorage.setItem("lang", switcher.value);
      location.reload();
    });
  </script>

  <script src="lang.js"></script>

</body>
</html>
